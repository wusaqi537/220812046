<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>粒子贴图生成器</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a2e;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    
    h1 {
      color: #4a7bff;
      margin-bottom: 20px;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      background-color: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      max-width: 800px;
      width: 100%;
    }
    
    .canvas-container {
      display: flex;
      gap: 40px;
      align-items: center;
      margin: 20px 0;
    }
    
    canvas {
      background-color: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
    }
    
    .preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    
    .preview-container {
      width: 200px;
      height: 200px;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }
    
    .preview-img {
      display: block;
      max-width: 100%;
    }
    
    .controls {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      max-width: 400px;
    }
    
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    
    label {
      font-size: 14px;
      color: #bbb;
    }
    
    input[type="range"] {
      width: 100%;
    }
    
    input[type="color"] {
      width: 50px;
      height: 30px;
      border: none;
      padding: 0;
      background: none;
    }
    
    .color-stop {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    button {
      background-color: #4a7bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    button:hover {
      background-color: #3a5fd0;
    }
    
    .instructions {
      margin-top: 20px;
      font-size: 14px;
      color: #bbb;
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>粒子贴图生成器</h1>
    
    <div class="canvas-container">
      <div>
        <canvas id="particleCanvas" width="128" height="128"></canvas>
        <p>原始尺寸 (128x128)</p>
      </div>
      
      <div class="preview">
        <div class="preview-container">
          <img id="previewImage" class="preview-img" src="" alt="粒子预览">
        </div>
        <p>预览效果</p>
      </div>
    </div>
    
    <div class="controls">
      <div class="control-group">
        <label>粒子大小</label>
        <input type="range" id="sizeSlider" min="10" max="128" value="64" step="1">
      </div>
      
      <div class="control-group">
        <label>颜色停止点 1 (中心)</label>
        <div class="color-stop">
          <input type="color" id="colorStop1" value="#ffffff">
          <input type="range" id="opacityStop1" min="0" max="1" value="1" step="0.05">
          <span id="opacityValue1">不透明度: 1.0</span>
        </div>
      </div>
      
      <div class="control-group">
        <label>颜色停止点 2</label>
        <div class="color-stop">
          <input type="color" id="colorStop2" value="#ffffff">
          <input type="range" id="opacityStop2" min="0" max="1" value="0.8" step="0.05">
          <span id="opacityValue2">不透明度: 0.8</span>
        </div>
      </div>
      
      <div class="control-group">
        <label>颜色停止点 3</label>
        <div class="color-stop">
          <input type="color" id="colorStop3" value="#c8c8ff">
          <input type="range" id="opacityStop3" min="0" max="1" value="0.3" step="0.05">
          <span id="opacityValue3">不透明度: 0.3</span>
        </div>
      </div>
      
      <div class="control-group">
        <label>颜色停止点 4 (边缘)</label>
        <div class="color-stop">
          <input type="color" id="colorStop4" value="#6464c8">
          <input type="range" id="opacityStop4" min="0" max="1" value="0" step="0.05">
          <span id="opacityValue4">不透明度: 0.0</span>
        </div>
      </div>
    </div>
    
    <button id="download">下载贴图</button>
    
    <div class="instructions">
      <p>使用此工具生成粒子贴图。调整大小和颜色，然后点击"下载贴图"按钮保存PNG格式的贴图。</p>
      <p>将下载的贴图保存到 <code>src/assets/textures/particle.png</code>。</p>
    </div>
  </div>
  
  <script>
    // 获取DOM元素
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    const preview = document.getElementById('previewImage');
    const sizeSlider = document.getElementById('sizeSlider');
    const downloadBtn = document.getElementById('download');
    
    // 颜色停止点控制
    const colorStop1 = document.getElementById('colorStop1');
    const colorStop2 = document.getElementById('colorStop2');
    const colorStop3 = document.getElementById('colorStop3');
    const colorStop4 = document.getElementById('colorStop4');
    
    const opacityStop1 = document.getElementById('opacityStop1');
    const opacityStop2 = document.getElementById('opacityStop2');
    const opacityStop3 = document.getElementById('opacityStop3');
    const opacityStop4 = document.getElementById('opacityStop4');
    
    const opacityValue1 = document.getElementById('opacityValue1');
    const opacityValue2 = document.getElementById('opacityValue2');
    const opacityValue3 = document.getElementById('opacityValue3');
    const opacityValue4 = document.getElementById('opacityValue4');
    
    // 更新不透明度显示
    opacityStop1.addEventListener('input', () => {
      opacityValue1.textContent = `不透明度: ${parseFloat(opacityStop1.value).toFixed(1)}`;
      drawParticle();
    });
    
    opacityStop2.addEventListener('input', () => {
      opacityValue2.textContent = `不透明度: ${parseFloat(opacityStop2.value).toFixed(1)}`;
      drawParticle();
    });
    
    opacityStop3.addEventListener('input', () => {
      opacityValue3.textContent = `不透明度: ${parseFloat(opacityStop3.value).toFixed(1)}`;
      drawParticle();
    });
    
    opacityStop4.addEventListener('input', () => {
      opacityValue4.textContent = `不透明度: ${parseFloat(opacityStop4.value).toFixed(1)}`;
      drawParticle();
    });
    
    // 监听控件变化
    sizeSlider.addEventListener('input', drawParticle);
    colorStop1.addEventListener('input', drawParticle);
    colorStop2.addEventListener('input', drawParticle);
    colorStop3.addEventListener('input', drawParticle);
    colorStop4.addEventListener('input', drawParticle);
    
    // 绘制粒子函数
    function drawParticle() {
      // 清除画布
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // 获取粒子大小
      const size = parseInt(sizeSlider.value);
      const radius = size / 2;
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      
      // 创建径向渐变
      const gradient = ctx.createRadialGradient(
        centerX, centerY, 0,
        centerX, centerY, radius
      );
      
      // 添加颜色停止点
      const hexToRgba = (hex, opacity) => {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${opacity})`;
      };
      
      gradient.addColorStop(0, hexToRgba(colorStop1.value, opacityStop1.value));
      gradient.addColorStop(0.3, hexToRgba(colorStop2.value, opacityStop2.value));
      gradient.addColorStop(0.7, hexToRgba(colorStop3.value, opacityStop3.value));
      gradient.addColorStop(1, hexToRgba(colorStop4.value, opacityStop4.value));
      
      // 填充渐变
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // 更新预览
      updatePreview();
    }
    
    // 更新预览图像
    function updatePreview() {
      preview.src = canvas.toDataURL('image/png');
    }
    
    // 下载贴图
    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'particle.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
    
    // 初始绘制
    drawParticle();
  </script>
</body>
</html>
