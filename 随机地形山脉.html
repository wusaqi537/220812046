<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机山脉地形</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        .info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            max-width: 200px;
            z-index: 100;
        }
        .info-panel h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }
        .info-panel p {
            margin: 5px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <h3>随机山脉地形</h3>
        <p>使用simplex-noise生成连续随机地形</p>
        <p>双击切换线框/实体显示模式</p>
    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "simplex-noise": "https://unpkg.com/simplex-noise@4.0.1/dist/esm/simplex-noise.js"
            }
        }
    </script>
    <script type="module" src="terrain.js"></script>
</body>
</html>
